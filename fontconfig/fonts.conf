<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Helvetica = Nimbus Sans (gsfonts); Liberation Sans until that is installed.
       Noto stays last so Devanagari, CJK and emoji still render -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Nimbus Sans</family><family>Liberation Sans</family><family>Symbols Nerd Font</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Nimbus Sans</family><family>Liberation Sans</family><family>Symbols Nerd Font</family><family>Noto Serif</family></prefer>
  </alias>
  <!-- Chrome's defaults ask for these by name, bypassing the generic aliases -->
  <alias binding="strong"><family>Arial</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Liberation Serif</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>DejaVu Sans</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>DejaVu Serif</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <!-- code and terminals stay monospaced -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Symbols Nerd Font</family><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
