# SwayFX-only effects (vanilla sway rejects these). Included from config.
corner_radius 0
smart_corner_radius off

shadows enable
shadows_on_csd disable
shadow_blur_radius 18
shadow_color #000000aa
shadow_inactive_color #00000066
shadow_offset 0 4

blur enable
blur_xray disable
blur_passes 2
blur_radius 4

default_dim_inactive 0.12
dim_inactive_colors.unfocused #000000ff
dim_inactive_colors.urgent #fb4934ff

# Frosted-glass waybar, notifications and launcher
# waybar: fully transparent around the pills (no blur, no shadow)
layer_effects "waybar" blur disable; shadows disable
layer_effects "swaync-control-center" blur enable; shadows enable
# blur only behind the card itself, no shadow box around the whole popup area
layer_effects "swaync-notification-window" blur enable; blur_ignore_transparent enable; shadows disable
layer_effects "wofi" blur enable; shadows enable

# Dropdown terminal and floating windows get extra pop
for_window [app_id="dropdown"] shadows enable
