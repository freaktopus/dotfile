# kitty config for Linux with i3 and polybar (guide: shortcut.md)
# i3 draws the borders, so kitty must not draw decorations

# Remote control over the UNIX socket only. Scripts such as polybar can query
# kitty. Requests from the TTY are denied, which stops malicious output from
# running kitty commands.
allow_remote_control socket-only

# The socket is created as /tmp/kitty-<pid>
# Use it with: kitten @ --to unix:/tmp/kitty-<pid> ls
listen_on unix:/tmp/kitty

# Do not let sudo change the environment of the shell
shell_integration no-sudo

# Fonts: FiraCode Nerd Font with programming ligatures (=> != -> === <= ...)
#   ss02 <= >=   ss03 &   ss05 @   ss07 =~ !~   ss08 == === != !== spacing   cv29/cv30 braces, pipe
font_family      family="FiraCode Nerd Font" features="+calt +liga +ss02 +ss03 +ss05 +ss07 +ss08 +cv29 +cv30"
bold_font        family="FiraCode Nerd Font" style="SemiBold" features="+calt +liga +ss02 +ss03 +ss05 +ss07 +ss08 +cv29 +cv30"
# FiraCode has no italic design: kitty slants the regular face
italic_font      auto
bold_italic_font auto
# Nerd Font icons come from the symbols-only font
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font
font_size 10

# kitty reports TERM=xterm-kitty. tmux sets TERM again for the panes it
# creates, from its own default-terminal setting in the tmux config.
term xterm-kitty

scrollback_lines 50000

# Copy the selection to the clipboard
copy_on_select yes

# Start zsh, and use nvim as the editor
shell zsh --login
editor nvim

# i3 draws the borders, so hide the kitty decorations
hide_window_decorations yes
window_padding_width 1 5 2 2

# Ask before closing a window that still has a program running
confirm_os_window_close -1

# Silent bell, the status bar and polybar show the alerts
enable_audio_bell no

# Cursor: a thin beam that does not blink
cursor_shape beam
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Cursor trail
cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

# picom renders the transparency, picom must run with a compositor backend
background_opacity 0.83

# i3 uses Alt as its modifier and Super acts as Alt on this keyboard, so
# kitty_mod is ctrl+shift, which is the kitty default on Linux
kitty_mod ctrl+shift

# Windows and tabs. i3 splits and resizes containers, so kitty needs no
# layout, resize or swap shortcuts.
map kitty_mod+enter new_window
map kitty_mod+h previous_window
map kitty_mod+l next_window
map kitty_mod+t new_tab_with_cwd
map kitty_mod+left previous_tab
map kitty_mod+right next_tab
map kitty_mod+w close_window
map kitty_mod+q close_os_window

# Reload this file
map kitty_mod+, load_config_file

# Scrollback
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -
map kitty_mod+z show_scrollback

# Open the scrollback buffer in nvim as an overlay window
map kitty_mod+i launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay /bin/zsh -c "nvim +$ +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set number relativenumber' +'$' -"

# Quick access terminal: press the keys one after the other
map kitty_mod+a>d launch --type=background kitten quick-access-terminal

# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME

# Devanagari: JetBrainsMono has no Devanagari glyphs, so kitty fell back per-glyph
# to random fonts. Pin the whole block to one clear font.
symbol_map U+0900-U+097F,U+A8E0-U+A8FF,U+1CD0-U+1CFF Noto Sans Devanagari

# ---------------------------------------------------------------------------
# tmux-style setup (see ~/.config/kitty/shortcut.md for the full guide)
# tmux window = kitty tab, tmux pane = kitty window, tmux session = kitty session
# ---------------------------------------------------------------------------
enabled_layouts splits,stack
tab_bar_style custom
# no bold/italic anywhere in the bottom bar
active_tab_font_style   normal
inactive_tab_font_style normal
tab_bar_edge bottom
tab_bar_min_tabs 1
# show only the tabs of the active session (+ tabs that belong to none)
tab_bar_filter session:. or session:^$
tab_title_template "{title}"
startup_session ~/.config/kitty/sessions/arch-freaktopus.kitty-session
window_border_width 1pt
active_border_color #d65d0e
inactive_border_color #504945
draw_minimal_borders yes

# Prefix is Ctrl-a, same as tmux: press it, release, then the key.
# Ctrl-a Ctrl-a sends a real Ctrl-a (readline "start of line") to the program.
map ctrl+a>ctrl+a send_text all \x01

# sessions
map ctrl+a>shift+s kitten session_ctl.py pick
# Ctrl-a s saves only the tabs of the active session into manual/<session>_<timestamp>.
# Ctrl-a o replaces the tabs of the active session with a saved set from manual/.
# Ctrl-a O reloads the last manual save of the session. Ctrl-a Ctrl-k closes the session's tabs.
# Ctrl-a X deletes a saved set from manual/, Ctrl-a N renames one.
# Autosave (all sessions, every 15 minutes) goes to autosave/. Ctrl-a r reloads the active
# session from the newest of sessions/<device> and autosave/<device>.
map ctrl+a>s kitten session_ctl.py save
map ctrl+a>o kitten session_ctl.py load
map ctrl+a>shift+o kitten session_ctl.py load-last
map ctrl+a>ctrl+k kitten session_ctl.py kill
map ctrl+a>shift+x kitten session_ctl.py forget
map ctrl+a>shift+n kitten session_ctl.py rename-saved
map ctrl+a>n kitten session_ctl.py new
map ctrl+a>shift+r kitten session_ctl.py rename
map ctrl+a>m kitten session_ctl.py menu
map ctrl+a>r kitten session_ctl.py reload-all

# tabs (tmux windows)
map ctrl+a>c new_tab_with_cwd
map ctrl+a>w select_tab
map ctrl+a>ctrl+h previous_tab
map ctrl+a>ctrl+l next_tab
map ctrl+a>tab goto_tab -1
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9
map ctrl+a>, set_tab_title
map ctrl+a>& close_tab
map ctrl+a>ctrl+shift+h move_tab_backward
map ctrl+a>ctrl+shift+l move_tab_forward

# splits (tmux panes)
map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>_ launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window down
map ctrl+a>k neighboring_window up
map ctrl+a>l neighboring_window right
map ctrl+a>shift+h resize_window narrower 3
map ctrl+a>shift+l resize_window wider 3
map ctrl+a>shift+j resize_window shorter 3
map ctrl+a>shift+k resize_window taller 3
map ctrl+a>z toggle_layout stack
map ctrl+a>x close_window
map ctrl+a>! detach_window new-tab
map ctrl+a>q focus_visible_window
map ctrl+a>space next_layout
map ctrl+a>shift+, move_window_backward
map ctrl+a>shift+. move_window_forward

# misc
map ctrl+a>ctrl+r load_config_file
map ctrl+a>e edit_config_file
map ctrl+a>: kitty_shell overlay
map ctrl+a>? launch --type=overlay --stdin-source=none sh -c 'less ~/.config/kitty/shortcut.md'
map ctrl+l combine : clear_terminal scrollback active : send_text normal,application \x0c

# Mouse: selecting text copies it on release (copy_on_select above);
# right-click pastes the clipboard, middle-click pastes the last selection.
mouse_map right press ungrabbed paste_from_clipboard
